[package]
name = "naivepost"
version = "0.1.0"
edition = "2021"
# Cargo's test discovery is OFF: `tests/` holds SHARED MODULES as well as targets, and a file pulled
# in by a path-attribute `mod` has no `common` of its own, so discovery must not build it as its own
# test binary. The shared ones are the socket harnesses (`captions_wire_harness`,
# `narrate_live_harness`, `speak_tts_wire_harness`, `join_live_harness`, `policy_live_harness`) and
# `_f2_14_press_fixture`. Every other file under `tests/` is listed as a `[[test]]` at the foot of
# this file, so a NEW test file needs a line there too.
autotests = false

[lib]
name = "naivepost"
path = "src/lib.rs"

[[bin]]
name = "naivepost"
path = "src/main.rs"

autotests = false


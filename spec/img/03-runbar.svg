<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" font-family="Cantarell, Inter, 'Noto Sans', 'DejaVu Sans', sans-serif" font-size="13">
  <!-- Proposed run bar (flow F0.2): ▶ this step · ⏹, then the progress bar and the visible tab's readouts; the log header under it. 12 px from the window's edges, 8 px between controls and between the two rows. -->
  <rect width="900" height="120" fill="#fafafa"/>
  <line x1="0" y1="0.5" x2="900" y2="0.5" stroke="#d6d6d6"/>
  <!-- ▶ this step -->
  <rect x="12" y="12" width="36" height="34" rx="6" fill="#3584e4"/>
  <path d="M25,21 L37,29 L25,37 Z" fill="#fff"/>
  <!-- ⏹ -->
  <rect x="56" y="12" width="36" height="34" rx="6" fill="#ebebeb" stroke="#cdcdcd"/>
  <rect x="68" y="23" width="12" height="12" rx="1" fill="#2e2e2e"/>
  <!-- progress -->
  <rect x="104" y="27" width="400" height="5" rx="2.5" fill="#dcdcdc"/>
  <rect x="104" y="27" width="150" height="5" rx="2.5" fill="#3584e4"/>
  <text x="520" y="34" fill="#2e2e2e"><tspan font-weight="bold">Inputs:</tspan> 57 clips · 64:03</text>
  <text x="696" y="34" fill="#2e2e2e"><tspan font-weight="bold">Outputs:</tspan> 73 files, 1.2 GB</text>
  <!-- log header with the status line -->
  <text x="14" y="74" fill="#2e2e2e">› Log</text>
  <text x="888" y="74" text-anchor="end" fill="#8a8a8a">describe 1/2: chunk 4/12</text>
  <!-- labels -->
  <g font-size="11" fill="#6f6f6f">
    <text x="30" y="104" text-anchor="middle">this step</text>
    <text x="74" y="104" text-anchor="middle">stop</text>
  </g>
  <rect x="780" y="92" width="108" height="20" rx="10" fill="#fdf0d5" stroke="#e5a50a"/>
  <text x="834" y="106" text-anchor="middle" font-size="11" fill="#9c6e03">proposed</text>
</svg>
